version: "3.9"

services:
  hotel-db:
    image: postgres
    container_name: hotel-db
    environment:
      - POSTGRES_DB=HotelBookingAndManagement
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Root@123
    volumes:
      - hotel-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  hotel-backend:
    image: rohanpokale/hotel_booking_and_management_backend:v0.0.1
    container_name: hotel-backend
    depends_on:
      - hotel-db
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://hotel-db:5432/HotelBookingAndManagement
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=Root@123
      - JWT_SECRETKEY=fsfkhfkbsuui34mnsdhfbsdjhasu4373b33fssar7s8s8fnssjasbfusdfgh8f
    networks:
      - hotel-network

volumes:
  hotel-db-data:

networks:
  hotel-network:
